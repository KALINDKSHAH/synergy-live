<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNERGY - Collaboration OS Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #060a11;
            --bg-app: #0B1120;
            --bg-card: #141C2F;
            --bg-card-highlight: #1A243A;
            
            --text-main: #FFFFFF;
            --text-muted: #8B9BB4;
            --text-dark: #0B1120;
            
            /* Accent Colors */
            --accent-teal: #2DD4BF;
            --accent-purple: #A78BFA;
            --accent-coral: #FB7185;
            --accent-orange: #FBBF24;
            --accent-green: #34D399;
            --accent-blue: #60A5FA;
            
            --border-subtle: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Device Simulator Container */
        .device-simulator {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--bg-app);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 450px) {
            .device-simulator {
                height: 850px;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* Header / Top Section */
        header {
            padding: 40px 24px 20px 24px;
            position: relative;
            z-index: 10;
        }

        .header-brand {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .header-role {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Decorative Header Graphic */
        .header-graphic-container {
            position: absolute;
            top: -40px;
            right: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: -1;
            transition: background-color 0.5s ease;
        }

        .header-graphic-inner {
            width: 100px;
            height: 100px;
            background-color: var(--bg-app);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-graphic-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: background-color 0.5s ease;
        }

        /* Main Scrollable Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 100px 24px; /* Bottom padding for nav */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        /* Hide scrollbar for cleaner look */
        main::-webkit-scrollbar {
            display: none;
        }
        main {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Standard Cards */
        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .card:active {
            transform: scale(0.98);
            background-color: var(--bg-card-highlight);
        }

        /* Staggered animation delays */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.25s; }
        .card:nth-child(5) { animation-delay: 0.3s; }

        .card-content {
            flex: 1;
            padding-right: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        /* Status Icon Box */
        .status-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            flex-shrink: 0;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background-color: var(--bg-card);
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            padding: 16px 24px;
            border: 1px solid var(--border-subtle);
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .nav-item.active {
            opacity: 1;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 700;
        }

        .nav-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .nav-item.active .nav-dot {
            background-color: var(--accent-teal);
        }

        /* Role Switcher */
        .role-switcher {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 30;
        }
        
        .role-switcher select {
            background-color: var(--bg-card-highlight);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="device-simulator">
        <!-- Role Switcher for Live App -->
        <div class="role-switcher">
            <select id="roleSelect" onchange="switchRole(this.value)">
                <option value="sponsor">Role: Sponsor</option>
                <option value="pm">Role: Project Manager</option>
                <option value="team">Role: Team Member</option>
            </select>
        </div>

        <header>
            <div class="header-graphic-container" id="headerGraphicBg">
                <div class="header-graphic-inner">
                    <div class="header-graphic-dot" id="headerGraphicDot"></div>
                </div>
            </div>
            
            <div class="header-brand">SYNERGY</div>
            <h1 class="header-role" id="headerRole">SPONSOR</h1>
            <div class="header-subtitle" id="headerSubtitle">Portfolio pulse</div>
        </header>

        <main id="mainContent">
            <!-- Content will be injected here via JavaScript -->
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-label">Home</div>
                <div class="nav-dot"></div>
            </div>
            <div class="nav-item">
                <div class="nav-label">Work</div>
                <div class="nav-dot"></div>
            </div>
            <div class="nav-item">
                <div class="nav-label">Pulse</div>
                <div class="nav-dot"></div>
            </div>
        </nav>
    </div>

    <!-- THIS IS THE NEW JAVASCRIPT YOU ASKED FOR -->
    <script>
        const headerRole = document.getElementById('headerRole');
        const headerSubtitle = document.getElementById('headerSubtitle');
        const mainContent = document.getElementById('mainContent');

        const uiConfig = {
            sponsor: { roleName: "SPONSOR", subtitle: "Portfolio pulse", color: "var(--accent-teal)" },
            pm: { roleName: "PROJECT MANAGER", subtitle: "Control loop", color: "var(--accent-purple)" },
            team: { roleName: "TEAM MEMBER", subtitle: "My work", color: "var(--accent-orange)" }
        };

        async function switchRole(roleKey) {
            if (!uiConfig[roleKey]) return; // Exit if role doesn't exist
            
            // Update Header UI
            headerRole.innerText = uiConfig[roleKey].roleName;
            headerSubtitle.innerText = uiConfig[roleKey].subtitle;
            document.getElementById('headerGraphicBg').style.backgroundColor = uiConfig[roleKey].color;
            document.getElementById('headerGraphicDot').style.backgroundColor = uiConfig[roleKey].color;
            
            mainContent.innerHTML = '<div style="text-align:center; padding: 20px;">Fetching live Excel data...</div>';
            
            try {
                const response = await fetch(`/api/data/${roleKey}`);
                const data = await response.json();
                
                mainContent.innerHTML = ''; 
                
                if (data.length === 0) {
                    mainContent.innerHTML = '<div style="text-align:center;">No data found.</div>';
                    return;
                }

                data.forEach(row => {
                    const keys = Object.keys(row);
                    const title = keys.length > 0 ? row[keys[0]] : "Metric";
                    const value = keys.length > 1 ? row[keys[1]] : "N/A";
                    
                    mainContent.innerHTML += `
                        <div class="card">
                            <div class="card-content">
                                <div class="card-title">${title}</div>
                                <div class="card-value" style="color: ${uiConfig[roleKey].color};">${value}</div>
                            </div>
                            <div class="status-box" style="background-color: ${uiConfig[roleKey].color}; opacity: 0.2;">📊</div>
                        </div>`;
                });
            } catch (error) {
                mainContent.innerHTML = `<div style="text-align:center; color: red;">Error connecting to backend.</div>`;
            }
        }

        window.onload = () => switchRole('sponsor');
    </script>
</body>
</html>
